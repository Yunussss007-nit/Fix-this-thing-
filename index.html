.top{text-align:center;font-weight:900;font-size:1.3rem;text-shadow:0 2px 12px #0008}
.sub{text-align:center;color:var(--mut);font-size:.9rem}
.row{display:flex;gap:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px #0004}
.pl{flex:1;min-height:100px;position:relative;min-width:0}
.hd{display:flex;align-items:center;gap:7px}

.stage{position:relative;width:140px;height:140px;display:grid;place-items:center}

.ring{position:absolute;inset:6px;border-radius:50%;border:2px dashed #fff5;animation:spin 14s linear infinite}
.big{font-size:5.4rem;line-height:1;position:relative;filter:drop-shadow(0 8px 14px #0007);animation:float 3s ease-in-out infinite}
.nm{font-size:1.35rem;font-weight:900;margin-top:4px}

const R=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- host-side game logic ---------- */
function newS(){return{ph:'lobby',n:[name,null],gp:null,b:[20,20],W:[0,0],it:[[],[]],rd:0,ct:'',idx:0,cur:null,bid:0,lead:-1,busy:false,msg:'',win:-1,sc:[0,0],q:[]}}
function pub(){
  const c=S.cur,end=S.ph==='end';
  return{ph:S.ph,n:S.n,b:S.b,W:S.W,rd:S.rd,ct:S.ct,idx:S.idx,tot:S.q.length,code:S.pub?'':code,
    cur:c?{e:c.e,n:c.n,st:Math.ceil(c.v/2)}:null,bid:S.bid,lead:S.lead,busy:S.busy,msg:S.msg,
    it:S.it.map(a=>a.map(x=>({e:x.e,n:x.n,v:end?x.v:0}))),win:end?S.win:-1,sc:end?S.sc:null};
}
function push(){V=pub();render();if(r)r.emit('state',V).catch(()=>{});if(S&&S.ai)botThink()}
function startRound(){
  if(used.length>=CH.length)used=[];
  let k;do{k=R(CH.length)}while(used.includes(k));used.push(k);
  const c=CH[k];
  S.q=shuf(c.items).slice(0,8).map(s=>{const i=s.indexOf(' ');return{e:s.slice(0,i),n:s.slice(i+1),v:1+R(10)}});
  S.ct=c.e+' '+c.t;S.rd++;S.idx=0;S.b=[20,20];S.it=[[],[]];S.ph='play';S.win=-1;nextItem();genRound();
}
function nextItem(){
  if(S.idx>=S.q.length)return endRound();
  S.cur=S.q[S.idx];S.busy=false;S.bid=0;S.lead=-1;S.msg='Place the first bid!';push();
}
function settle(){
  S.busy=true;
  if(S.lead>=0){S.b[S.lead]-=S.bid;S.it[S.lead].push(S.cur);S.msg=S.n[S.lead]+' won it for $'+S.bid+'!'}
  else S.msg='Nobody bid\u2026';
  push();setTimeout(()=>{S.idx++;nextItem()},1100);
}
function endRound(){
  S.sc=S.it.map(a=>a.reduce((s,x)=>s+x.v,0));
  S.win=S.sc[0]===S.sc[1]?-1:(S.sc[0]>S.sc[1]?0:1);
  if(S.win>=0)S.W[S.win]++;
  S.ph='end';S.cur=null;push();logGame();
}
function act(i,a){
  if(!S)return;
  if(a==='go'){if((S.ph==='end'||(S.ph==='lobby'&&i===0))&&S.n[1]!=null)startRound();return}
  if(S.ph!=='play'||S.busy)return;
  if(a==='bid'){
    if(S.lead===i)return;
    const nb=S.bid+1;
    if(S.b[i]<nb){S.msg=S.n[i]+' can\u2019t afford $'+nb+'!';push();return}
    S.bid=nb;S.lead=i;S.msg=S.n[i]+' bid $'+nb+'. '+S.n[1-i]+': raise or confirm?';push();
  }else if(a==='confirm'){if(S.lead===1-i)settle()}
  else if(a==='skip'){if(S.lead<0)settle()}
}

const PFX='fioff-';let lastErr='';
function inPreview(){
  try{return !/^https?:$/.test(location.protocol)||/(^|\.)(claude\.ai|claude\.com|claudeusercontent\.com|anthropic\.com)$/.test(location.hostname)}catch(e){return true}
}
const PREVIEW_MSG='Online play does not work inside the Claude preview. Open your GitHub Pages link in Chrome. (Play with AI works here.)';
class Room{
  constructor(code,host){this.code=code.toUpperCase();this.host=host;this.h={};this.conns=[];this.peer=null;this.conn=null;this.dead=false;this.noRecon=false;this.onclose=null;this.id=''}
  open(){return new Promise((res,rej)=>{
    if(!window.Peer)return rej(new Error('nopeer'));
    let done=false;
    const fin=(ok,e)=>{if(done)return;done=true;clearTimeout(to);if(ok)res(this);else{this.leave();rej(e||new Error('fail'))}};
    const to=setTimeout(()=>fin(false,new Error('timeout')),9000);
    try{this.peer=this.host?new Peer(PFX+this.code):new Peer()}catch(e){return fin(false,e)}
    this.peer.on('error',e=>{if(!done)fin(false,e)});
    this.peer.on('disconnected',()=>{if(!this.dead&&!this.noRecon&&done){try{this.peer.reconnect()}catch(e){}}});
    this.peer.on('open',id=>{
      this.id=id;
      if(this.host)return fin(true);
      const c=this.peer.connect(PFX+this.code,{serialization:'json',reliable:true});
      this.conn=c;
      c.on('open',()=>fin(true));
      c.on('error',e=>fin(false,e));
      c.on('data',d=>this._in(d,null));
      c.on('close',()=>{if(!this.dead&&this.onclose)this.onclose()});
    });
    if(this.host)this.peer.on('connection',c=>{
      c.on('open',()=>{this.conns.push(c)});
      c.on('data',d=>this._in(d,c));
      c.on('close',()=>{this.conns=this.conns.filter(x=>x!==c)});
      c.on('error',()=>{});
    });
  })}
  _in(d,c){
    if(!d||typeof d.e!=='string')return;
    if(c)d.p=c.peer;
    if(this.host)this.conns.forEach(x=>{if(x!==c&&x.open){try{x.send(d)}catch(e){}}});
    this._do(d,false);
  }
  _do(d,me){const f=this.h[d.e];if(f)f.slice().forEach(fn=>{try{fn({data:d.d,isMe:me,peer:d.p})}catch(e){}})}
  on(e,fn){(this.h[e]=this.h[e]||[]).push(fn)}
  emit(e,data){
    const m={e,d:data,p:this.id};
    try{
      if(this.host)this.conns.forEach(c=>{if(c.open)c.send(m)});
      else if(this.conn&&this.conn.open)this.conn.send(m);
    }catch(x){}
    this._do(m,true);
    return Promise.resolve();
  }
  release(){this.noRecon=true;try{this.peer.disconnect()}catch(e){}}
  leave(){
    this.dead=true;
    try{this.conns.forEach(c=>c.close())}catch(e){}
    try{this.conn&&this.conn.close()}catch(e){}
    try{this.peer&&this.peer.destroy()}catch(e){}
  }
}

/* ---------- Firebase rooms (used when DB_URL is set; more reliable than PeerJS) ---------- */
const fbBase=()=>DB_URL.replace(/\/$/,'');
async function fget(u){const x=await fetch(u);if(!x.ok)throw{type:'http'+x.status};return x.json()}
class FbRoom{
  constructor(code,host){this.code=code.toUpperCase();this.host=host;this.h={};this.dead=false;this.onclose=null;this.id=Math.random().toString(36).slice(2,10);this.n=0;this.es=null;this.tm=null;this.lastRx=0;this.adv=null;this.owned=false}
  u(p){return fbBase()+'/rooms/'+this.code+p+'.json'}
  async open(){
    try{
      const cur=await fget(this.u('/h'));
      if(this.host){
        if(cur)throw{type:'unavailable-id'};
        const x=await fetch(this.u('/h'),{method:'PUT',body:'1'});
        if(!x.ok)throw{type:'http'+x.status};
        this.owned=true;
      }else if(!cur)throw{type:'peer-unavailable'};
      await this._listen();
      if(!this.host){
        this.tm=setInterval(()=>{if(!this.dead&&this.lastRx&&Date.now()-this.lastRx>20000){this.lastRx=0;if(this.onclose)this.onclose()}},5000);
      }
    }catch(e){this.leave();throw e}
    return this;
  }
  _listen(){return new Promise((res,rej)=>{
    let first=true,done=false;
    const t=setTimeout(()=>{if(!done){done=true;rej({type:'timeout'})}},9000);
    let es;try{es=new EventSource(this.u('/m'))}catch(e){clearTimeout(t);return rej({type:'noeventsource'})}
    this.es=es;
    es.addEventListener('put',ev=>{
      let j;try{j=JSON.parse(ev.data)}catch(e){return}
      if(first){first=false;if(!done){done=true;clearTimeout(t);res()}}
      const k=String(j.path||'').split('/')[1];
      if(!k||typeof j.data!=='string')return;
      this._ext(j.data);
    });
    es.onerror=()=>{if(!done){done=true;clearTimeout(t);rej({type:'network'})}};
  })}
  _ext(str){
    let m;try{m=JSON.parse(str)}catch(e){return}
    if(!m||typeof m.e!=='string'||m.p===this.id)return;
    this.lastRx=Date.now();
    this._do(m,false);
  }
  _do(d,me){const f=this.h[d.e];if(f)f.slice().forEach(fn=>{try{fn({data:d.d,isMe:me,peer:d.p})}catch(e){}})}
  on(e,fn){(this.h[e]=this.h[e]||[]).push(fn)}
  emit(e,data){
    const m={e,d:data,p:this.id,n:++this.n};
    try{fetch(this.u('/m/'+this.id+'__'+e),{method:'PUT',body:JSON.stringify(JSON.stringify(m))}).catch(()=>{})}catch(x){}
    this._do(m,true);
    return Promise.resolve();
  }
  async release(){
    try{const h=await fget(fbBase()+'/queue/head.json');if(h&&h.code===this.code)fetch(fbBase()+'/queue/head.json',{method:'DELETE'}).catch(()=>{})}catch(e){}
  }
  leave(){
    if(this.dead)return;this.dead=true;
    try{this.es&&this.es.close()}catch(e){}
    clearInterval(this.tm);
    if(this.host&&this.owned){try{fetch(this.u(''),{method:'DELETE',keepalive:true}).catch(()=>{});this.release()}catch(e){}}
  }
}

async function connect(c,asHost){
  try{
    r=await (DB_URL?new FbRoom(c,asHost):new Room(c,asHost)).open();
  }catch(e){r=null;lastErr=String((e&&(e.type||e.message))||e);return false}
  r.on('state',m=>{if(m.isMe||isHost)return;const j=JSON.stringify(m.data);clearInterval(jt);searching=false;if(j===lastJ)return;lastJ=j;V=m.data;render()});
  r.on('full',m=>{if(!isHost&&!V&&m.data&&m.data.nm===name){clearInterval(jt);leave();if(searching){searchScr();pubLoop();return}err='That room already has two players.';joinForm()}});
  r.on('hello',m=>{
    if(!isHost||m.isMe||!S||!m.data||typeof m.data.name!=='string')return;
    const nm=m.data.name.slice(0,14)||'Friend';
    if(S.gp==null||S.gp===m.peer||S.n[1]===nm){S.gp=m.peer;S.n[1]=nm;push();if(S.pub&&S.ph==='lobby'){searching=false;try{r.release&&r.release()}catch(e){}act(0,'go')}}
    else r.emit('full',{nm}).catch(()=>{});
  });
  r.on('act',m=>{
    if(!isHost||m.isMe||!S||m.peer!==S.gp||!m.data)return;
    if(['bid','confirm','skip','go'].includes(m.data.a))act(1,m.data.a);
  });
  r.on('chat',m=>{const d=m.data;if(d&&typeof d.t==='string')addMsg({n:String(d.n||'?').slice(0,14),t:d.t.slice(0,120),me:m.isMe})});
  r.on('art',m=>{
    const d=m.data;
    if(isHost||m.isMe||!d||typeof d.k!=='string'||typeof d.svg!=='string'||d.svg.length>3200||!/^<svg[\s>]/.test(d.svg)||/<script|\son\w+=|href=|<foreignObject|<image/i.test(d.svg))return;
    ART[d.k]={svg:d.svg,cap:String(d.cap||'').slice(0,140)};
    if(V&&V.ph==='play'&&V.cur&&V.ct+'|'+V.cur.n===d.k)render();
  });
  r.onclose=()=>{if(isHost||!r)return;quit();err='Connection lost. The host left the game.';menu()};
  msgs=[];unread=0;updBadge();renderChat();
  return true;
}

function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[R(A.length)];return c}
function quit(){clearInterval(hb);clearInterval(jt);clearTimeout(bt);leave();S=null;V=null;isHost=false;searching=false;err='';menu()}

function botThink(){
  clearTimeout(bt);
  if(!S||!S.ai||S.ph!=='play'||S.busy||S.lead===1)return;
  const idx=S.idx;
  bt=setTimeout(()=>{
    if(!S||S.idx!==idx||S.busy||S.ph!=='play'||S.lead===1)return;
    const est=S.cur.v+R(5)-2,max=Math.min(S.b[1],Math.max(0,Math.floor(est*.55+R(2))));
    if(S.lead===0)act(1,S.bid+1<=max?'bid':'confirm');
    else if(max>=1&&R(100)<60)act(1,'bid');
    else bt=setTimeout(botThink,2000);
  },900+R(1000));
}
async function pubSwitch(c){
  clearInterval(hb);leave();S=null;V=null;isHost=false;
  if(await connect(c,false)){isHost=false;me=1;code=c;err='';V=null;startHello();return}
  if(searching){searchScr();pubLoop()}
}
async function pubLoopFb(){
  const q=fbBase()+'/queue/head.json';
  for(let k=0;k<30&&searching;k++){
    let h=null;
    try{h=await fget(q)}catch(e){lastErr=(e&&e.type)||'net'}
    if(!searching)return;
    if(h&&typeof h.code==='string'&&h.code.length===4){
      if(await connect(h.code,false)){
        if(!searching){leave();return}
        isHost=false;me=1;code=h.code;err='';V=null;startHello();return;
      }
      try{await fetch(q,{method:'DELETE'})}catch(e){}
    }else{
      const c=genCode();
      if(await connect(c,true)){
        if(!searching){leave();return}
        isHost=true;me=0;code=c;S=newS();S.pub=1;err='';push();
        clearInterval(hb);hb=setInterval(beat,3000);
        const me0=c;
        r.adv=async()=>{
          try{
            const x=await fget(q);
            if(!S||!S.pub||S.n[1]!=null||code!==me0)return;
            if(x&&typeof x.code==='string'&&x.code<me0&&x.code.length===4){pubSwitch(x.code);return}
            await fetch(q,{method:'PUT',body:JSON.stringify({code:me0})});
          }catch(e){}
        };
        r.adv();return;
      }
    }
    await new Promise(x=>setTimeout(x,1200+R(1800)));
  }
  if(searching){quit();err='No opponent found right now. Try again, or invite a friend with a room code.';menu()}
}
async function pubLoop(){
  if(DB_URL)return pubLoopFb();
  for(let k=0;k<30&&searching;k++){
    if(await connect('PUBQ',true)){
      if(!searching){leave();return}
      isHost=true;me=0;code='PUBQ';S=newS();S.pub=1;err='';push();
      clearInterval(hb);hb=setInterval(beat,3000);return;
    }
    if(!searching)return;
    if(await connect('PUBQ',false)){
      if(!searching){leave();return}
      isHost=false;me=1;code='PUBQ';err='';V=null;startHello();return;
    }
    if(!searching)return;
    await new Promise(x=>setTimeout(x,1200+R(1800)));
  }
  if(searching){quit();err='No opponent found right now. Try again, or invite a friend with a room code.';menu()}
}
function publicGame(){
  if(!getName())return;

}

let pv=null,fl={},thKey='',lastJ='',ac=null,mute=false,P=[],raf=0;
function toggleMute(){mute=!mute;$('#mt').textContent=mute?'🔇':'🔊'}
function snd(f,d,type,g){
  if(mute)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),k=ac.createGain(),t=ac.currentTime;
    o.type=type||'sine';o.frequency.value=f;k.gain.setValueAtTime(g||.12,t);k.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(k);k.connect(ac.destination);o.start();o.stop(t+d);
  }catch(e){}
}
function tune(a){a.forEach((f,i)=>setTimeout(()=>snd(f,.18,'triangle',.15),i*110))}
function burst(x,y,n){
  const c=$('#fx'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffd23f','#ff4d8d','#3ec1ff','#7cff6b','#ffffff'];
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=3+Math.random()*9;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:3+Math.random()*5,c:cols[R(5)],l:80+R(40),t:Math.random()*6})}
  if(raf)return;
  const step=()=>{
    g.clearRect(0,0,c.width,c.height);
    P=P.filter(p=>p.l>0);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.l--;p.t+=.2;g.globalAlpha=Math.min(1,p.l/30);g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.t);g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()}
    if(P.length)raf=requestAnimationFrame(step);else{raf=0;g.clearRect(0,0,c.width,c.height)}
  };
  raf=requestAnimationFrame(step);
}
function themeFor(v){
  const key=v&&v.ct?v.ct:'menu';
  if(key===thKey)return;thKey=key;
  let h=0;for(const ch of key)h=(h*31+ch.charCodeAt(0))%360;
  document.documentElement.style.setProperty('--h',key==='menu'?265:h);
  const em=key==='menu'?['💸','🏠','🍕','🚗','🎁','🏊','🍔','🎮','🌎','🤖']:[key.split(' ')[0]];
  let s='';for(let i=0;i<18;i++)s+=`<span style="left:${R(96)}%;font-size:${1.4+R(30)/10}rem;animation-duration:${9+R(12)}s;animation-delay:-${R(20)}s">${em[i%em.length]}</span>`;
  $('#bg').innerHTML=s;
}
function fx(v){
  const p=pv;pv=v;fl={};
  if(!p)return;
  if(v.ph==='end'&&p.ph!=='end'){burst(innerWidth/2,innerHeight*.3,160);tune([523,659,784,1047]);return}
  if(v.ph!=='play')return;
  if(p.ph!=='play'||v.idx!==p.idx){fl.newItem=true;snd(300,.1,'triangle')}
  else if(v.bid>p.bid){fl.bump=true;snd(380+v.bid*45,.12,'square',.08)}
  if(v.busy&&!p.busy&&v.lead>=0){burst(innerWidth/2,innerHeight*.4,70);tune([660,880])}
}

const ART={},TRY={};let SM=null,msgs=[],unread=0,chatOpen=false,lastSend=0;
async function getSample(){

async function genArt(ct,it){
  const k=ct+'|'+it.n;
  if(ART[k]||TRY[k])return;TRY[k]=1;
  const sm=await getSample();if(!sm)return;
  try{
    const o=await sm.json(`You are the illustrator for a party game. Challenge: "${ct}". Item: "${it.n}" (${it.e}).
Return ONLY JSON: {"svg":"...","cap":"..."}.
svg: one self-contained SVG with viewBox='0 0 200 200', under 2500 characters, a charming cartoon picture of the item with vivid gradients and simple shapes, single-quoted attributes, no text, no script, no images, no links.
cap: one fun sentence under 16 words that starts with "This will add to" and names the thing being improved, then "like" and a playful comparison. Example: This will add to the castle like a moat adds drama.`,{modelTier:'quick'});
    const svg=String(o&&o.svg||'');
    if(!/^<svg[\s>]/.test(svg)||/<script|\son\w+=|href=|<foreignObject|<image/i.test(svg)||svg.length>3000)return;
    ART[k]={svg,cap:String(o.cap||'').slice(0,140)};
    if(r)r.emit('art',{k,svg,cap:ART[k].cap}).catch(()=>{});

}

  const col=k=>`<div class="card pl p${k} ${v.win===k?'win':''}"><b>${esc(v.n[k])}${v.win===k?' 🏆':''}</b><div class="sc">${v.sc[k]} pts</div><div class="res">${v.it[k].map(x=>`<span><span>${x.e} ${esc(x.n)}</span><span>${x.v}</span></span>`).join('')||'<span>Bought nothing</span>'}</div><div class="sub" style="text-align:left;margin-top:6px">$${v.b[k]} left</div></div>`;
  $('#app').innerHTML=`<div class="top">${esc(v.ct)}</div>
  <div class="top" style="font-size:1.6rem">${v.win<0?'It’s a tie!':esc(v.n[v.win])+' wins!'}</div>
  <div class="sub">Wins so far: ${v.W[0]}–${v.W[1]}</div>
  <div class="row" style="align-items:flex-start">${col(0)}${col(1)}</div>
  <button class="big-btn" onclick="send('go')">Next challenge</button><button class="cf" style="background:#777" onclick="quit()">Leave</button>`;
}
menu();
</script></body></html>
